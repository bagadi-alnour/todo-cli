name: Claude

# Two ways Claude reads a pull request:
#   review  — once when a PR opens, reopens or leaves draft, with Anthropic's
#             code-review plugin. The repo's CLAUDE.md is the standard it holds
#             the diff to, so a repo without one gets a generic review.
#   mention — any comment containing @claude, on a PR or an issue, from someone
#             with write access. "@claude review again" after a push is the
#             re-review; reviewing every push would pay for every fixup commit.
#
# Needs the Claude GitHub app on this repository and the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). The same file sits in
# every bagadi-alnour repository; change it in all of them or in none.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment server only when this names it.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

  mention:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5
